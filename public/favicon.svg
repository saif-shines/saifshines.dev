<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .fg { fill: #111827; stroke: #111827; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #f3f4f6; stroke: #f3f4f6; }
    }
  </style>
  <g class="fg">
    <!-- Central light -->
    <circle cx="64" cy="64" r="22"/>
    <!-- 8 shine rays -->
    <g stroke-width="5" stroke-linecap="round">
      <!-- N -->
      <line x1="64" y1="16" x2="64" y2="38"/>
      <!-- NE -->
      <line x1="94" y1="34" x2="78" y2="48"/>
      <!-- E -->
      <line x1="112" y1="64" x2="90" y2="64"/>
      <!-- SE -->
      <line x1="94" y1="94" x2="78" y2="80"/>
      <!-- S -->
      <line x1="64" y1="112" x2="64" y2="90"/>
      <!-- SW -->
      <line x1="34" y1="94" x2="50" y2="80"/>
      <!-- W -->
      <line x1="16" y1="64" x2="38" y2="64"/>
      <!-- NW -->
      <line x1="34" y1="34" x2="50" y2="48"/>
    </g>
  </g>
</svg>